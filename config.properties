#Setting

#保存先パスを絶対パスで指定してください
savePath=C:/Instantsnap画像保存先/

#撮影範囲の選択
#1 -> アクティブウィンドウ(デフォルト), 2 -> アクティブモニター
#3 -> 全てのモニター, 4 -> カスタム範囲
snapMode=1

#拡張子の選択 png、jpg、bmp、gifのいずれかを記載してください
format=gif

#スクショ発動キーの選択
#1 -> shift + printscreen(推奨), 2 -> printscreen
trigger=1

#撮影後、フォルダ、画像を自動で開く設定です
#1 -> フォルダ, 2 -> 画像, それ以外 -> 開かない
openMode=0